name: Fetch Content
on:
  schedule:
    - cron: '0 6 * * *'      # daily, 06:00 UTC
    - cron: '0 7 * * 1'      # weekly, Monday 07:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: 'daily or weekly'
        default: 'daily'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install anthropic
      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 7 * * 1" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.inputs.mode }}" != "" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi
      - run: python scripts/fetch_content.py --mode ${{ steps.mode.outputs.mode }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add knowledge/ manifest.json
          git diff --staged --quiet || git commit -m "${{ steps.mode.outputs.mode }} content fetch"
          git push
